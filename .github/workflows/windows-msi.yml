name: Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [main, feature/cross-platform-installers]

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout Frxe Desktop
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend tooling
        run: npm install

      - name: Verify frontend
        run: npm run check

      - name: Generate native icons
        run: npm run icons

      - name: Test native backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build MSI
        run: npm run tauri:build:windows

      - name: Stage MSI
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release-upload | Out-Null
          $msi = Get-ChildItem -Path src-tauri\target\release\bundle\msi -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw "Tauri build completed without an MSI." }
          Copy-Item $msi.FullName release-upload\Frxe-Desktop-0.1.0-x64.msi -Force

      - name: Upload Frxe Desktop MSI
        uses: actions/upload-artifact@v4
        with:
          name: Frxe-Desktop-0.1.0-Windows
          path: release-upload/Frxe-Desktop-0.1.0-x64.msi
          if-no-files-found: error
