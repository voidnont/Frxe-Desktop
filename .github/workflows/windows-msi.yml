name: Windows MSI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout Frxe Desktop
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build signed Windows package
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "TAURI_SIGNING_PRIVATE_KEY is required." }
          & .\platforms\windows\build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Frxe Desktop Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Frxe-Desktop-1.2.2-Windows
          path: |
            release-upload/Frxe-Desktop-1.2.2-x64.msi
            release-upload/Frxe-Desktop-1.2.2-x64.msi.sig
          if-no-files-found: error
