name: Repository Cleanup Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete legacy release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" --jq '.id' 2>/dev/null || true)"
          if [[ -n "$release_id" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          fi

          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.1.0" >/dev/null 2>&1 || true

      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            'cleanup/v1.2.2-final'
            'cleanup/v1.2.2'
            'feat/ytmusic-volume-links'
            'feature/cross-platform-installers'
            'fix/windows-console'
            'release/upload-v0.1.0'
          )

          for branch in "${branches[@]}"; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1 || true
          done
