name: Linux Packages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Checkout Frxe Desktop
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build signed Linux packages
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "TAURI_SIGNING_PRIVATE_KEY is required."; exit 1; }
          bash platforms/linux/build.sh

      - name: Upload Frxe Desktop Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Frxe-Desktop-1.2.2-Linux
          path: |
            release-upload/Frxe-Desktop-1.2.2-amd64.deb
            release-upload/Frxe-Desktop-1.2.2-x86_64.AppImage
            release-upload/Frxe-Desktop-1.2.2-x86_64.AppImage.sig
          if-no-files-found: error
