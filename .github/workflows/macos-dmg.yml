name: macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            file: Frxe-Desktop-1.2.2-macos-arm64.dmg
            artifact: Frxe-Desktop-1.2.2-macOS-Apple-Silicon
          - runner: macos-26-intel
            file: Frxe-Desktop-1.2.2-macos-x64.dmg
            artifact: Frxe-Desktop-1.2.2-macOS-Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout Frxe Desktop
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS package
        shell: bash
        run: |
          set -euo pipefail
          bash platforms/macos/build.sh
          test -f "release-upload/${{ matrix.file }}"

      - name: Upload Frxe Desktop macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-upload/${{ matrix.file }}
          if-no-files-found: error
