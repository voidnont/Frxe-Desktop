name: macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            file: Frxe-Desktop-1.2.2-macos-arm64.dmg
            updater: Frxe-Desktop-1.2.2-macos-arm64.app.tar.gz
            signature: Frxe-Desktop-1.2.2-macos-arm64.app.tar.gz.sig
            artifact: Frxe-Desktop-1.2.2-macOS-Apple-Silicon
          - runner: macos-26-intel
            file: Frxe-Desktop-1.2.2-macos-x64.dmg
            updater: Frxe-Desktop-1.2.2-macos-x64.app.tar.gz
            signature: Frxe-Desktop-1.2.2-macos-x64.app.tar.gz.sig
            artifact: Frxe-Desktop-1.2.2-macOS-Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout Frxe Desktop
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build signed macOS package
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "TAURI_SIGNING_PRIVATE_KEY is required."; exit 1; }
          bash platforms/macos/build.sh
          test -f "release-upload/${{ matrix.file }}"
          test -f "release-upload/${{ matrix.updater }}"
          test -f "release-upload/${{ matrix.signature }}"

      - name: Upload Frxe Desktop macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release-upload/${{ matrix.file }}
            release-upload/${{ matrix.updater }}
            release-upload/${{ matrix.signature }}
          if-no-files-found: error
