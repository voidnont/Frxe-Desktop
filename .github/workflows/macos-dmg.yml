name: macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: Frxe-Desktop-1.2.4-macOS-Apple-Silicon
            package: release-upload/Frxe-Desktop-1.2.4-macos-arm64.dmg
          - runner: macos-15-intel
            artifact: Frxe-Desktop-1.2.4-macOS-Intel
            package: release-upload/Frxe-Desktop-1.2.4-macos-x64.dmg

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout Frxe Desktop
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS package
        run: bash platforms/macos/build.sh

      - name: Upload Frxe Desktop macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error
