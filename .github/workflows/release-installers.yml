name: Publish Installers to Release

on:
  workflow_run:
    workflows: ["Windows MSI", "Linux Packages", "macOS DMG"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: frxe-release-v1.2.2
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Find matching successful package runs
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          find_run() {
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$1" \
              --branch main \
              --commit "$HEAD_SHA" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          }

          windows_run="$(find_run 'Windows MSI')"
          linux_run="$(find_run 'Linux Packages')"
          macos_run="$(find_run 'macOS DMG')"

          if [[ -z "$windows_run" || -z "$linux_run" || -z "$macos_run" ]]; then
            echo "Not all v1.2.2 packages are green for $HEAD_SHA yet; a later workflow event will retry."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "windows_run=$windows_run" >> "$GITHUB_OUTPUT"
          echo "linux_run=$linux_run" >> "$GITHUB_OUTPUT"
          echo "macos_run=$macos_run" >> "$GITHUB_OUTPUT"

      - name: Download verified packages
        if: steps.runs.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN: ${{ steps.runs.outputs.windows_run }}
          LINUX_RUN: ${{ steps.runs.outputs.linux_run }}
          MACOS_RUN: ${{ steps.runs.outputs.macos_run }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload
          gh run download "$WINDOWS_RUN" --repo "$GITHUB_REPOSITORY" --name "Frxe-Desktop-1.2.2-Windows" --dir release-upload
          gh run download "$LINUX_RUN" --repo "$GITHUB_REPOSITORY" --name "Frxe-Desktop-1.2.2-Linux" --dir release-upload
          gh run download "$MACOS_RUN" --repo "$GITHUB_REPOSITORY" --name "Frxe-Desktop-1.2.2-macOS-Apple-Silicon" --dir release-upload
          gh run download "$MACOS_RUN" --repo "$GITHUB_REPOSITORY" --name "Frxe-Desktop-1.2.2-macOS-Intel" --dir release-upload

          test -f release-upload/Frxe-Desktop-1.2.2-x64.msi
          test -f release-upload/Frxe-Desktop-1.2.2-amd64.deb
          test -f release-upload/Frxe-Desktop-1.2.2-x86_64.AppImage
          test -f release-upload/Frxe-Desktop-1.2.2-macos-arm64.dmg
          test -f release-upload/Frxe-Desktop-1.2.2-macos-x64.dmg

      - name: Publish Frxe Desktop 1.2.2
        if: steps.runs.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v1.2.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.2.2 \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "Frxe Desktop 1.2.2" \
              --notes "Frxe Desktop 1.2.2 for Windows, Linux and macOS."
          fi

          gh release upload v1.2.2 \
            release-upload/Frxe-Desktop-1.2.2-x64.msi \
            release-upload/Frxe-Desktop-1.2.2-amd64.deb \
            release-upload/Frxe-Desktop-1.2.2-x86_64.AppImage \
            release-upload/Frxe-Desktop-1.2.2-macos-arm64.dmg \
            release-upload/Frxe-Desktop-1.2.2-macos-x64.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify published release assets
        if: steps.runs.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view v1.2.2 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for required in \
            Frxe-Desktop-1.2.2-x64.msi \
            Frxe-Desktop-1.2.2-amd64.deb \
            Frxe-Desktop-1.2.2-x86_64.AppImage \
            Frxe-Desktop-1.2.2-macos-arm64.dmg \
            Frxe-Desktop-1.2.2-macos-x64.dmg; do
            grep -Fx "$required" <<<"$assets" >/dev/null || { echo "Missing release asset: $required"; exit 1; }
          done
