name: Apply download and history management

on:
  push:
    branches: [v1.2.3]
    paths:
      - '.github/workflows/apply-download-history.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout v1.2.3
        uses: actions/checkout@v4
        with:
          ref: v1.2.3
          fetch-depth: 0

      - name: Apply minimal production changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('web/core.mjs')
          core = core_path.read_text()
          old_core = """export function removeTrackReferences(collections, track) {
  const key = trackKey(track);
  const filterTracks = (items) => (Array.isArray(items) ? items : []).filter((item) => trackKey(item) !== key);
  const playlists = (Array.isArray(collections?.playlists) ? collections.playlists : []).map((playlist) => ({
    ...playlist,
    tracks: filterTracks(playlist?.tracks),
  }));
  return {
    queue: filterTracks(collections?.queue),
    favorites: filterTracks(collections?.favorites),
    history: filterTracks(collections?.history),
    playlists,
  };
}
"""
          new_core = """export function pruneTrackReferences(collections, track) {
  const key = trackKey(track);
  const filterTracks = (items) => (Array.isArray(items) ? items : []).filter((item) => trackKey(item) !== key);
  const queue = filterTracks(collections?.queue);
  const requestedIndex = Number.isInteger(collections?.queueIndex) ? collections.queueIndex : -1;
  const queueIndex = !queue.length || requestedIndex < 0 ? -1 : Math.min(requestedIndex, queue.length - 1);
  const playlists = (Array.isArray(collections?.playlists) ? collections.playlists : []).map((playlist) => ({
    ...playlist,
    tracks: filterTracks(playlist?.tracks),
  }));
  return {
    queue,
    queueIndex,
    favorites: filterTracks(collections?.favorites),
    history: filterTracks(collections?.history),
    playlists,
  };
}

export const removeTrackReferences = pruneTrackReferences;
"""
          if old_core not in core:
              raise SystemExit('Expected removeTrackReferences block not found')
          core_path.write_text(core.replace(old_core, new_core, 1))

          app_path = Path('web/app.mjs')
          app = app_path.read_text()
          if "  removeTrackReferences,\n" not in app:
              raise SystemExit('Expected removeTrackReferences import not found')
          app = app.replace("  removeTrackReferences,\n", "  pruneTrackReferences,\n", 1)

          old_call = """    const cleaned = removeTrackReferences({
      queue: state.queue,
      favorites: state.favorites,
      history: state.history,
      playlists: state.playlists,
    }, target);

    state.queue = cleaned.queue;
"""
          new_call = """    const cleaned = pruneTrackReferences({
      queue: state.queue,
      queueIndex: state.queueIndex,
      favorites: state.favorites,
      history: state.history,
      playlists: state.playlists,
    }, target);

    state.queue = cleaned.queue;
    state.queueIndex = cleaned.queueIndex;
"""
          if old_call not in app:
              raise SystemExit('Expected download pruning call not found')
          app = app.replace(old_call, new_call, 1)

          marker = """    case 'remove-download': await removeOfflineTrack(track); break;
    case 'playlist-picker': {
"""
          replacement = """    case 'remove-download': await removeOfflineTrack(track); break;
    case 'remove-history': {
      const target = track || findTrackByKey(button.dataset.track);
      if (!target) break;
      const key = trackKey(target);
      state.history = state.history.filter((item) => trackKey(item) !== key);
      persistLists();
      render();
      break;
    }
    case 'clear-history':
      state.history = [];
      persistLists();
      render();
      break;
    case 'playlist-picker': {
"""
          if marker not in app:
              raise SystemExit('Expected action insertion point not found')
          app_path.write_text(app.replace(marker, replacement, 1))
          PY

      - name: Verify targeted regression test
        run: node --test tests/download-history.test.mjs

      - name: Commit production fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-download-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/core.mjs web/app.mjs .github/workflows/apply-download-history.yml
          git commit -m "feat: manage downloads and listening history"
          git push origin HEAD:v1.2.3
