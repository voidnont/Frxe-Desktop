name: Apply v1.2.3 Playback Fix

on:
  push:
    branches: [v1.2.3]
    paths:
      - '.github/workflows/v123-apply-playback-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.2.3
          fetch-depth: 1

      - name: Apply queue alignment fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path('web/core.mjs')
          core_text = core.read_text()
          marker = """export function queuePrefetchTracks(queue, index, distance = 2) {"""
          helper = """export function selectPlaybackQueue(track, candidates = []) {
            if (!track) return { queue: [], index: -1 };
            const queue = Array.isArray(candidates) ? candidates : [];
            const index = queue.findIndex((item) => trackKey(item) === trackKey(track));
            if (index >= 0) return { queue: [...queue], index };
            return { queue: [track], index: 0 };
          }

          """
          if 'export function selectPlaybackQueue' in core_text:
              raise SystemExit('selectPlaybackQueue already exists')
          if marker not in core_text:
              raise SystemExit('core insertion marker not found')
          core.write_text(core_text.replace(marker, helper + marker, 1))

          app = Path('web/app.mjs')
          app_text = app.read_text()
          old_import = """  safeJsonParse,
            trackKey,
          } from './core.mjs';"""
          new_import = """  safeJsonParse,
            selectPlaybackQueue,
            trackKey,
          } from './core.mjs';"""
          if old_import not in app_text:
              raise SystemExit('app import marker not found')
          app_text = app_text.replace(old_import, new_import, 1)

          old_play = """      const sourceList = state.tab === 'search' ? state.searchResults : state.tab === 'library' ? [...state.favorites, ...state.offline] : state.tab === 'save' ? state.offline : state.history.length ? state.history : [track];
                const idx = Math.max(0, sourceList.findIndex((item) => trackKey(item) === trackKey(track)));
                await playTrack(track, sourceList, idx);"""
          new_play = """      const sourceList = state.tab === 'search' ? state.searchResults : state.tab === 'library' ? [...state.favorites, ...state.offline] : state.tab === 'save' ? state.offline : state.history.length ? state.history : [track];
                const selection = selectPlaybackQueue(track, sourceList);
                await playTrack(track, selection.queue, selection.index);"""
          if old_play not in app_text:
              raise SystemExit('play-track marker not found')
          app.write_text(app_text.replace(old_play, new_play, 1))
          PY

      - name: Commit production fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v123-apply-playback-fix.yml
          git config user.name 'void'
          git config user.email 'voidnont@proton.me'
          git add web/core.mjs web/app.mjs .github/workflows/v123-apply-playback-fix.yml
          git commit -m 'fix: keep active track aligned with queue'
          git push origin HEAD:v1.2.3
