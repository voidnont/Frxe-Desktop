name: Apply v1.2.3 Runtime UI Fix

on:
  push:
    branches: [v1.2.3]
    paths:
      - '.github/workflows/v123-apply-runtime-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.2.3
      - name: Apply runtime UI accuracy fix
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('web/app.mjs')
          app = app_path.read_text()
          old_update = """async function updateRuntime() {
            state.runtimeLoading = true;
            render();
            try {
              state.runtimeStatus = await backend.updateRuntimeDependencies();
              toast(state.runtimeStatus?.warnings?.length ? 'Runtime updated with warnings.' : 'Runtime dependencies updated.');
            } catch (error) {
              toast(`Runtime update failed: ${readableError(error)}`, 'error');
            } finally {
              state.runtimeLoading = false;
              render();
            }
          }"""
          new_update = """async function updateRuntime() {
            state.runtimeLoading = true;
            render();
            try {
              state.runtimeStatus = await backend.updateRuntimeDependencies();
              toast(state.runtimeStatus?.warnings?.length
                ? 'yt-dlp updated. Runtime checks found warnings.'
                : 'yt-dlp updated.');
            } catch (error) {
              toast(`yt-dlp update failed: ${readableError(error)}`, 'error');
            } finally {
              state.runtimeLoading = false;
              render();
            }
          }"""
          if old_update not in app:
              raise SystemExit('updateRuntime block not found')
          app = app.replace(old_update, new_update, 1)
          tray_block = """  try {
            await backend.setTrayEnabled(state.prefs.trayEnabled);
          } catch {}
          try {
            downloadUnlisten = await backend.onDownloadProgress"""
          status_block = """  try {
            await backend.setTrayEnabled(state.prefs.trayEnabled);
          } catch {}
          try {
            state.runtimeStatus = await backend.currentRuntimeStatus();
          } catch {}
          try {
            downloadUnlisten = await backend.onDownloadProgress"""
          if tray_block not in app:
              raise SystemExit('tray startup block not found')
          app = app.replace(tray_block, status_block, 1)
          app_path.write_text(app)

          ui_path = Path('web/ui.mjs')
          ui = ui_path.read_text()
          old_copy = '<p>yt-dlp, Deno, FFmpeg and InnerTube compatibility are managed by Frxe Desktop.</p>'
          new_copy = '<p>Frxe manages yt-dlp. Deno and FFmpeg are detected from your system and shown here when available.</p>'
          if old_copy not in ui:
              raise SystemExit('runtime copy not found')
          ui = ui.replace(old_copy, new_copy, 1)
          old_button = "${state.runtimeLoading ? 'Updating…' : 'Update runtime dependencies'}"
          new_button = "${state.runtimeLoading ? 'Updating yt-dlp…' : 'Update yt-dlp'}"
          if old_button not in ui:
              raise SystemExit('runtime button not found')
          ui = ui.replace(old_button, new_button, 1)
          ui_path.write_text(ui)
      - name: Commit production fix and remove temporary workflow
        run: |
          git config user.name "void"
          git config user.email "voidnont@proton.me"
          git rm .github/workflows/v123-apply-runtime-ui.yml
          git add web/app.mjs web/ui.mjs
          git commit -m "fix: make runtime management status accurate"
          git push origin HEAD:v1.2.3
