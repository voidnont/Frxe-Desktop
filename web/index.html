<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Frxe Desktop</title>
  <link rel="stylesheet" href="./styles-1.css" />
  <link rel="stylesheet" href="./styles-2.css" />
  <link rel="stylesheet" href="./styles-3.css" />
  <link rel="stylesheet" href="./styles-4.css" />
</head>
<body>
  <div id="ambient" aria-hidden="true"></div>
  <div id="ambient-shade" aria-hidden="true"></div>

  <header class="titlebar glass-lite" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <div class="brand-mark">F</div>
      <div data-tauri-drag-region>
        <strong>Frxe</strong>
        <span>Desktop</span>
      </div>
    </div>
    <div class="titlebar-center" data-tauri-drag-region></div>
    <div class="window-actions">
      <button class="window-button" data-window="minimize" aria-label="Minimize">—</button>
      <button class="window-button" data-window="maximize" aria-label="Maximize">□</button>
      <button class="window-button close" data-window="close" aria-label="Close">×</button>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>
  <div id="toast-host" class="toast-host" aria-live="assertive"></div>
  <audio id="audio" preload="metadata"></audio>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
