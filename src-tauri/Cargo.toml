[package]
name = "frxe-desktop"
version = "1.2.4"
description = "Frxe Desktop for Windows, Linux and macOS"
authors = ["void"]
edition = "2021"

[lib]
name = "frxe_desktop_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6.0"
futures-util = "0.3"
percent-encoding = "2.3"
playwire = "1.0.0"
regex = "1.11"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2.5.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process", "sync"] }
url = "2.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
